<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Bodega</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light d-flex align-items-center vh-100">
    <main class="container">
      <div class="row justify-content-center w-100 mx-auto">
        <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
          <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body p-5">
              <div class="text-center mb-4">
                <h2 class="fw-bold text-primary mb-1">Bodega</h2>
                <p class="text-muted small">
                  Ingresa a tu cuenta para continuar
                </p>
              </div>

              <form id="loginForm" th:action="@{/login}" method="post">
                <div class="form-floating mb-3">
                  <input
                    name="usuario"
                    type="text"
                    class="form-control"
                    id="usuario"
                    placeholder="Usuario"
                    required
                  />
                  <label for="usuario" class="text-muted">Usuario</label>
                </div>

                <div class="form-floating mb-4">
                  <input
                    name="password"
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Contraseña"
                    required
                  />
                  <label for="password" class="text-muted">Contraseña</label>
                </div>

                <div th:if="${error != null}" class="alert alert-danger py-2 text-center" role="alert" th:text="${error}"></div>

                <button
                  type="submit"
                  class="btn btn-primary btn-lg w-100 rounded-pill fw-semibold shadow-sm"
                >
                  Iniciar sesión
                </button>
              </form>

              <div class="text-center mt-4 pt-3 border-top">
                <small class="text-secondary d-block mb-1"
                  >Credenciales de prueba:</small
                >
                <span class="badge bg-light text-dark border">User: admin</span>
                <span class="badge bg-light text-dark border"
                  >Pass: admin123</span
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
