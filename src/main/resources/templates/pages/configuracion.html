<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Configuración')}"></head>
<body>
  <div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('configuracion')}"></aside>
    <main class="main-content">
      <header class="topbar">
        <button class="btn btn-light d-lg-none" id="menuToggle" aria-label="Abrir menú"><i class="bi bi-list fs-4"></i></button>
        <div>
          <h1 class="page-title">Configuración</h1>
          <p class="page-subtitle">Parámetros del sistema</p>
        </div>
        <div class="top-actions"><div class="avatar avatar-top">AD</div></div>
      </header>

      <section class="container-fluid px-4 pb-4">
        <div th:replace="~{fragments/alertas :: alertas}"></div>

        <article class="panel-card p-4">
          <h5 class="mb-1"><i class="bi bi-gear me-1"></i>Datos generales</h5>
          <p class="text-muted small mb-4">Actualiza la información básica de tu bodega.</p>

          <form th:action="@{/configuracion/guardar}" th:object="${configuracion}" method="post">
            <div class="alert alert-danger py-2" th:if="${#fields.hasGlobalErrors()}" role="alert"><p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Revisa los datos.</p></div>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="nombreBodega" class="form-label">Nombre de la bodega *</label>
                <input id="nombreBodega" th:field="*{nombreBodega}" class="form-control" required th:classappend="${#fields.hasErrors('nombreBodega')} ? 'is-invalid' : ''">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombreBodega')}" th:errors="*{nombreBodega}">Valor no válido.</div>
              </div>
              <div class="col-md-3">
                <label for="moneda" class="form-label">Moneda</label>
                <select id="moneda" th:field="*{moneda}" class="form-select" th:classappend="${#fields.hasErrors('moneda')} ? 'is-invalid' : ''">
                  <option value="PEN">Soles (PEN)</option>
                  <option value="USD">Dólares (USD)</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('moneda')}" th:errors="*{moneda}">Valor no válido.</div>
              </div>
              <div class="col-md-3">
                <label for="tema" class="form-label">Tema</label>
                <select id="tema" th:field="*{tema}" class="form-select" th:classappend="${#fields.hasErrors('tema')} ? 'is-invalid' : ''">
                  <option value="claro">Claro</option>
                  <option value="oscuro">Oscuro</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('tema')}" th:errors="*{tema}">Valor no válido.</div>
              </div>
            </div>
            <div class="mt-4">
              <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Guardar configuración</button>
            </div>
          </form>
        </article>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('menuToggle')?.addEventListener('click', () =>
      document.getElementById('sidebar').classList.toggle('collapsed'));
  </script>
</body>
</html>
