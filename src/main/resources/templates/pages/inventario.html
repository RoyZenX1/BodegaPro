<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Inventario')}"></head>
<body>
  <div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('inventario')}"></aside>
    <main class="main-content">
      <header class="topbar">
        <button class="btn btn-light d-lg-none" id="menuToggle" aria-label="Abrir menú"><i class="bi bi-list fs-4"></i></button>
        <div>
          <h1 class="page-title">Inventario</h1>
          <p class="page-subtitle">Control de existencias</p>
        </div>
        <div class="top-actions"><div class="avatar avatar-top">AD</div></div>
      </header>

      <section class="container-fluid px-4 pb-4">
        <article class="panel-card">
          <header class="panel-header">
            <div>
              <h5>Estado del inventario</h5>
              <small>Visualiza el stock actual de cada producto.</small>
            </div>
          </header>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <caption class="visually-hidden">Inventario actual de productos</caption>
              <thead>
                <tr>
                  <th scope="col">Foto</th><th scope="col">Código</th><th scope="col">Producto</th><th scope="col">Categoría</th>
                  <th scope="col">Stock actual</th><th scope="col">Stock mínimo</th><th scope="col">Estado</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="p : ${productos}">
                  <td>
                    <img th:if="${!#strings.isEmpty(p.imagenUrl)}" th:src="${p.imagenUrl}" th:alt="|Foto de ${p.nombre}|"
                         class="img-thumbnail" style="width:44px;height:44px;object-fit:cover;" loading="lazy">
                    <span th:unless="${!#strings.isEmpty(p.imagenUrl)}" class="text-muted small" title="Sin foto"><i class="bi bi-image"></i></span>
                  </td>
                  <td th:text="${p.codigo}">P001</td>
                  <td th:text="${p.nombre}">Producto</td>
                  <td th:text="${p.categoria.nombre}">Categoría</td>
                  <td th:text="${p.stock}">0</td>
                  <td th:text="${p.stockMinimo}">0</td>
                  <td>
                    <span class="status" th:classappend="${p.stock <= p.stockMinimo} ? 'danger' : 'success'"
                          th:text="${p.stock <= p.stockMinimo} ? 'Stock bajo' : 'Disponible'">Disponible</span>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                  <td colspan="7" class="text-center text-muted py-4">
                    <i class="bi bi-inbox fs-3 d-block mb-2"></i>No hay productos registrados.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </article>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('menuToggle')?.addEventListener('click', () =>
      document.getElementById('sidebar').classList.toggle('collapsed'));
  </script>
</body>
</html>
